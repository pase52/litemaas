# -- Global settings
global:
  # -- Target platform: "kubernetes" or "openshift"
  platform: openshift
  # -- Cluster apps domain (e.g. "apps.cluster.example.com").
  # Auto-detected on OpenShift via post-install hook when empty.
  # Set explicitly to skip auto-detection.
  clusterDomain: ""
  # -- Enable cluster-scoped API lookups for auto-detection of clusterDomain
  # at template-rendering time (before resources are created).
  # Requires read access to config.openshift.io/v1 Ingress (typically cluster-admin).
  # Default false: the post-install hook handles auto-detection instead.
  # Set to true only if you have cluster-admin and want values resolved at template time.
  clusterScopedLookups: false
  # -- Global image pull secrets
  imagePullSecrets: []
  # -- Global image pull policy
  imagePullPolicy: IfNotPresent

# -- Override chart name
nameOverride: ""
# -- Override fully qualified app name
fullnameOverride: ""

# -- Network policy configuration
networkPolicy:
  # -- Enable NetworkPolicies for network segmentation.
  # When enabled, deploys deny-all-ingress default and per-component allow rules
  # so only expected traffic flows are permitted (e.g., only backend can reach PostgreSQL).
  enabled: false
  # -- Selectors to identify ingress controller / OpenShift router pods.
  # Required when networkPolicy and ingress/route are both enabled.
  # Example:
  #   namespaceSelector:
  #     kubernetes.io/metadata.name: ingress-nginx
  #   podSelector:
  #     app.kubernetes.io/name: ingress-nginx
  ingressController:
    # -- Namespace labels that identify the ingress controller namespace.
    # Required when networkPolicy and ingress/route are both enabled.
    # Example: { kubernetes.io/metadata.name: ingress-nginx }
    namespaceSelector: null
    # -- Pod labels that identify the ingress controller pods (omit to allow all pods in matched namespaces)
    # podSelector: {}

# -- Pod-level security context applied to all workloads.
# Matches the pattern already used in the OAuth setup hook Job.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context applied to all workloads.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# -- ServiceAccount configuration
serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- ServiceAccount name (auto-generated if empty)
  name: ""
  # -- Annotations to add to the ServiceAccount
  annotations: {}

# =============================================================================
# OAuth / OIDC
# =============================================================================
oauth:
  # -- OAuth mode: "serviceaccount" uses the ServiceAccount as an OAuth client
  # (no cluster-admin needed, OpenShift only) or "external" (provide your own
  # client ID/secret/issuer via backend.auth.oauthClientId etc.)
  mode: serviceaccount

  # -- Authentication provider: "openshift" (default) or "oidc" (standard OpenID Connect).
  # OpenShift uses custom OAuth endpoints and the OpenShift user API for user info.
  # OIDC uses standard .well-known/openid-configuration discovery and /userinfo endpoint.
  # When set to "oidc", oauth.mode should typically be "external".
  authProvider: openshift

  # -- OAuth issuer URL. Auto-constructed on OpenShift if empty:
  # https://oauth-openshift.<clusterDomain>
  # For OIDC providers, set this to the issuer URL (e.g., https://keycloak.example.com/realms/myrealm)
  issuer: ""

  # -- ServiceAccount token secret name for SA OAuth mode.
  # The chart creates one automatically when mode is "serviceaccount".
  # Set this to reference a pre-existing token secret.
  existingTokenSecret: ""

  # -- OIDC-specific settings (only used when authProvider is "oidc")
  oidc:
    # -- Claim name in OIDC userinfo response containing group memberships
    groupsClaim: groups
    # -- Override OIDC scopes (space-separated). Default: "openid profile email"
    scopes: ""

# =============================================================================
# PostgreSQL
# =============================================================================
postgresql:
  # -- Deploy built-in PostgreSQL. Set to false to use an external database.
  enabled: true

  image:
    repository: postgres
    tag: "16-alpine"

  auth:
    # -- PostgreSQL admin username
    username: litemaas_admin
    # -- PostgreSQL admin password (CHANGE THIS)
    password: changeme
    # -- Use an existing Secret instead of creating one.
    # Must contain keys: username, password
    existingSecret: ""

  persistence:
    # -- Storage size for the PostgreSQL PVC
    size: 10Gi
    # -- StorageClass name (empty = cluster default)
    storageClass: ""

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# =============================================================================
# Redis
# =============================================================================
redis:
  # -- Deploy built-in Redis for LiteLLM cache management.
  # Used by both LiteLLM (model/key caching) and the backend (cache flush after model CRUD).
  enabled: true

  image:
    repository: redis
    tag: "7-alpine"

  auth:
    # -- Redis password (CHANGE THIS). Set to "" to disable authentication.
    password: changeme
    # -- Use an existing Secret instead of creating one.
    # Must contain key: password
    existingSecret: ""

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# =============================================================================
# LiteLLM
# =============================================================================
litellm:
  # -- Deploy built-in LiteLLM proxy. Set to false to use an external instance.
  enabled: true

  image:
    repository: quay.io/rh-aiservices-bu/litellm-non-root
    tag: "main-v1.81.0-stable-custom"

  # -- Explicit database URL for LiteLLM. Auto-constructed when postgresql.enabled is true.
  databaseUrl: ""

  auth:
    # -- LiteLLM master/API key
    masterKey: changeme
    # -- LiteLLM admin UI username
    uiUsername: admin
    # -- LiteLLM admin UI password
    uiPassword: changeme
    # -- Use an existing Secret instead of creating one.
    # Must contain keys: database-url, master-key, ui-username, ui-password
    existingSecret: ""

  # -- Enable SSL verification for model API calls (set to false for self-signed certs)
  # ⚠️ Security Warning: Only disable for development/testing or when using internal
  # services with self-signed certificates (e.g., KServe on OpenShift)
  sslVerify: true

  # -- Extra environment variables for LiteLLM container
  # Use this to inject custom CA bundle environment variables for production SSL setup
  # Example:
  #   extraEnv:
  #     - name: REQUESTS_CA_BUNDLE
  #       value: /etc/ssl/certs/kserve-ca-bundle.crt
  #     - name: SSL_CERT_FILE
  #       value: /etc/ssl/certs/kserve-ca-bundle.crt
  #     - name: CURL_CA_BUNDLE
  #       value: /etc/ssl/certs/kserve-ca-bundle.crt
  #     # Set to "0" to disable Python's default HTTPS certificate verification (PEP 493)
  #     - name: PYTHONHTTPSVERIFY
  #       value: "0"
  extraEnv: []

  # -- Extra volumes for LiteLLM pod
  # Use this to mount custom CA bundles from ConfigMaps for production SSL setup
  # Example:
  #   extraVolumes:
  #     - name: kserve-ca-bundle
  #       configMap:
  #         name: kserve-ca-bundle
  #         items:
  #           - key: ca-bundle.crt
  #             path: kserve-ca-bundle.crt
  extraVolumes: []

  # -- Extra volume mounts for LiteLLM container
  # Use this to mount custom CA bundle files for production SSL setup
  # Example:
  #   extraVolumeMounts:
  #     - name: kserve-ca-bundle
  #       mountPath: /etc/ssl/certs/kserve-ca-bundle.crt
  #       subPath: kserve-ca-bundle.crt
  #       readOnly: true
  extraVolumeMounts: []

  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# =============================================================================
# Backend
# =============================================================================
backend:
  image:
    repository: quay.io/rh-aiservices-bu/litemaas-backend
    # -- Backend image tag. Defaults to the chart's appVersion when empty.
    tag: ""

  # -- Explicit database URL for the backend. Auto-constructed when postgresql.enabled is true.
  databaseUrl: ""
  # -- Explicit LiteLLM API URL. Auto-constructed when litellm.enabled is true.
  litellmApiUrl: ""
  # -- Explicit CORS origin. Auto-derived from ingress/route hostname if empty.
  corsOrigin: ""

  auth:
    # -- JWT signing secret (CHANGE THIS)
    jwtSecret: changeme
    # -- JWT token expiration
    jwtExpiresIn: "24h"
    # -- OAuth client ID (only used when oauth.mode is "external")
    oauthClientId: ""
    # -- OAuth client secret (only used when oauth.mode is "external")
    oauthClientSecret: ""
    # -- OAuth issuer URL (only used when oauth.mode is "external")
    oauthIssuer: ""
    # -- OAuth callback URL. Auto-derived from ingress/route hostname if empty.
    # Used in both "serviceaccount" and "external" modes.
    oauthCallbackUrl: ""
    # -- Admin API keys (comma-separated)
    adminApiKeys: changeme
    # -- Initial admin users (comma-separated usernames).
    # On OpenShift, auto-detected from the deploying user if empty.
    initialAdminUsers: ""
    # -- LiteLLM API key (must match litellm.auth.masterKey)
    litellmApiKey: changeme
    # -- Encryption key for stored model API keys (AES-256-GCM).
    # Falls back to litellmApiKey if empty. Recommended to set explicitly in production.
    litellmMasterKey: ""
    # -- Skip TLS verification for Kubernetes API calls (OpenShift only).
    # WARNING: Only use in dev/test environments with self-signed certificates. Security risk in production.
    k8sApiSkipTlsVerify: ""
    # -- Use an existing Secret instead of creating one.
    # Must contain keys: database-url, cors-origin, jwt-secret, oauth-client-id,
    # oauth-client-secret, oauth-issuer, oauth-callback-url, admin-api-keys, litellm-api-key, litellm-master-key, litellm-database-url
    existingSecret: ""

  # -- Rate limiting for backend API (NOT for LLM requests)
  rateLimit:
    max: "1000"
    timeWindow: "5m"

  # -- Default user budget/rate limits
  defaultUser:
    maxBudget: "100"
    tpmLimit: "100000"
    rpmLimit: "120"

  # -- Redis connection for flushing LiteLLM's cache after model CRUD operations.
  # Auto-constructed when redis.enabled is true. Set explicitly to use an external Redis.
  # If empty and redis.enabled is false, cache flush is disabled (non-fatal).
  redis:
    host: ""
    port: "6379"

  # -- Backup & Restore configuration
  backup:
    # -- LiteLLM database URL. Auto-constructed when postgresql.enabled is true.
    # Used for: (1) model sync cross-referencing to prevent deleted models reappearing,
    # and (2) LiteLLM database backup/restore. Recommended for production deployments.
    litellmDatabaseUrl: ""
    # -- Mount path for backup storage inside the container.
    # This value is set as BACKUP_STORAGE_PATH env var.
    storagePath: "/data/backups"

    persistence:
      # -- Storage size for the backup PVC
      size: 5Gi
      # -- StorageClass name (empty = cluster default)
      storageClass: ""

  # -- Set to "0" to disable TLS verification (not recommended for production)
  nodeTlsRejectUnauthorized: ""

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# =============================================================================
# RHOAI Models-as-a-Service (MaaS) backend (optional)
# =============================================================================
# When enabled, models can be served either by LiteLLM (default) or by the RHOAI 3.x
# Models-as-a-Service stack (MaaSModelRef / MaaSAuthPolicy / MaaSSubscription + maas-api).
# Disabled = no behavior change. See docs/features/maas-backend.md.
maas:
  # -- Enable the MaaS backend (sets MAAS_ENABLED)
  enabled: false
  # -- maas-api base URL, e.g. https://maas.apps.example.com/maas-api (MAAS_API_URL). Required.
  apiUrl: ""
  # -- Public OpenAI-compatible gateway URL handed to users, e.g. https://maas.apps.example.com
  # (MAAS_GATEWAY_URL). Shown in "View Key" and used by the Playground.
  gatewayUrl: ""
  # -- Namespace holding MaaSAuthPolicy / MaaSSubscription objects (MAAS_NAMESPACE)
  namespace: models-as-a-service
  # -- Comma-separated namespaces scanned for MaaSModelRef objects (MAAS_MODEL_NAMESPACES).
  # Empty = all namespaces (a ClusterRole is created); otherwise one Role per namespace.
  modelNamespaces: ""
  # -- Interval of the MaaSModelRef -> models sync (ms)
  syncIntervalMs: "300000"
  # -- Interval of the desired-state reconciler (policies, subscriptions, key retries, grace job) (ms)
  reconcileIntervalMs: "300000"
  # -- Default grace period (days) of the "Migrate to MaaS" admin action
  migrationGraceDays: "14"
  # -- OAuth scopes requested at login (OAUTH_SCOPES). The stored user token is used to call
  # maas-api, which may need a broader scope than the default "user:info user:check-access".
  # Empty = provider default. See docs/development/maas-backend-live-validation.md (A1).
  oauthScopes: ""
  # -- Dedicated encryption key for stored user tokens / MaaS keys / provider keys (ENCRYPTION_KEY).
  # Empty = falls back to backend.auth.litellmMasterKey / litellmApiKey.
  # WARNING: setting it on an existing install makes previously encrypted values unreadable.
  # With backend.auth.existingSecret, add an optional "encryption-key" entry to that Secret instead.
  encryptionKey: ""
  # -- Kubernetes API overrides (default: in-cluster ServiceAccount). Rarely needed.
  k8sApiUrl: ""
  # -- INSECURE: skip TLS verification for maas-api (MAAS_API_SKIP_TLS_VERIFY). maas-api receives
  # users' OpenShift tokens, so prefer trustedCaBundle / NODE_EXTRA_CA_CERTS. Independent of
  # backend.auth.k8sApiSkipTlsVerify.
  apiSkipTlsVerify: false
  usage:
    # -- Limitador token counter metric (MAAS_USAGE_HITS_METRIC)
    hitsMetric: authorized_hits
    # -- Limitador request counter metric (MAAS_USAGE_CALLS_METRIC)
    callsMetric: authorized_calls
    # -- Extra PromQL label matchers, e.g. namespace="kuadrant-system" (MAAS_USAGE_LABEL_MATCHERS)
    labelMatchers: ""
    # -- Days of history Prometheus/Thanos keeps (MAAS_USAGE_RETENTION_DAYS). Older days are never
    # re-queried by the usage resync; their cached MaaS usage is carried forward instead.
    retentionDays: 15
  prometheus:
    # -- Thanos Querier URL (PROMETHEUS_URL), needed for MaaS usage analytics. Empty: MaaS usage is
    # not collected (admin analytics show LiteLLM usage only) and /health reports prometheus: unconfigured.
    url: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
    # -- Skip TLS verification for Prometheus/Thanos (PROMETHEUS_SKIP_TLS_VERIFY)
    skipTlsVerify: false
    # -- Timeout of a single Prometheus query in milliseconds (PROMETHEUS_TIMEOUT_MS)
    timeoutMs: 10000
    # -- Bind the backend ServiceAccount to the cluster-monitoring-view ClusterRole
    clusterMonitoringView: true
  rbac:
    # -- Create the ClusterRole/Role/bindings the backend ServiceAccount needs
    # (requires cluster-admin at install time). Set false to manage RBAC yourself.
    create: true
  trustedCaBundle:
    # -- OpenShift: create a ConfigMap with the cluster trusted CA bundle injected and set
    # NODE_EXTRA_CA_CERTS so the backend trusts the ingress CA of the maas-api route.
    enabled: true
    # -- Use an existing ConfigMap (key ca-bundle.crt) instead of creating one
    existingConfigMap: ""

# =============================================================================
# Frontend
# =============================================================================
frontend:
  image:
    repository: quay.io/rh-aiservices-bu/litemaas-frontend
    # -- Frontend image tag. Defaults to the chart's appVersion when empty.
    tag: ""

  # -- Backend URL for the frontend container. Auto-constructed from backend service name if empty.
  backendUrl: ""

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# =============================================================================
# Ingress (Kubernetes)
# =============================================================================
ingress:
  # -- Enable Kubernetes Ingress resources (used when global.platform is "kubernetes")
  enabled: false
  # -- Ingress class name (e.g., "nginx")
  className: ""
  # -- Annotations for all Ingress resources
  annotations: {}

  frontend:
    # -- Hostname for the frontend Ingress
    host: ""
    # -- TLS configuration for the frontend Ingress
    # Example:
    #   tls:
    #     - secretName: litemaas-tls
    #       hosts:
    #         - litemaas.example.com
    tls: []

  litellm:
    # -- Enable a separate Ingress for LiteLLM (UI and model API).
    # Set to false to keep LiteLLM cluster-internal only.
    enabled: true
    # -- Hostname for the LiteLLM Ingress
    host: ""
    # -- TLS configuration for the LiteLLM Ingress
    tls: []

# =============================================================================
# Route (OpenShift)
# =============================================================================
route:
  # -- Enable OpenShift Route resources (used when global.platform is "openshift")
  enabled: false
  # -- Annotations for all Route resources
  annotations: {}

  frontend:
    # -- Hostname for the frontend Route (auto-generated by OpenShift if empty)
    host: ""
    # -- TLS termination type (edge, passthrough, reencrypt)
    termination: edge

  litellm:
    # -- Enable a separate Route for LiteLLM (UI and model API).
    # Set to false to keep LiteLLM cluster-internal only.
    enabled: true
    # -- Hostname for the LiteLLM Route (auto-generated by OpenShift if empty)
    host: ""
    # -- TLS termination type
    termination: edge

# =============================================================================
# Post-install Hook (OpenShift only)
# =============================================================================
hook:
  image:
    # -- Image for the post-install OAuth setup hook (must include kubectl)
    repository: bitnami/kubectl
    tag: latest
